# Local ZPR DNS demo env: relay (+ visa service) + web + client + dns, one
# image, static IPs. Each container runs one `ph zode`: the relay, and three
# endpoint Zodes linked to it. Bring up via local-compute/deploy-docker.sh (it
# assembles local-compute/conf/<name>/ first, then `docker compose up -d`).
#
# Subnet is 172.30.1.0/24 so it can coexist with multinode-demo's 172.30.0.0/24.
services:
  # The relay Zode (node.demo) with the visa service and valkey beside it, in
  # one network namespace: vs.zpr (fd5a:5052::1) is a second address on the
  # relay's TUN, and every endpoint Zode links to this container's port 5000.
  relay:
    image: zpr-dns-demo
    container_name: relay
    command: ["/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-relay.sh:/entrypoint.sh:ro
      - ./local-compute/conf/relay:/conf
      - ./local-compute/logs:/logs
    networks:
      zpr-dns-demo:
        ipv4_address: 172.30.1.10
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"

  web:
    image: zpr-dns-demo
    container_name: web
    command: ["/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-web.sh:/entrypoint.sh:ro
      - ./local-compute/conf/web:/conf
      - ./local-compute/logs:/logs
      # The docroot is container-local: entrypoint-web.sh runs regen-banner.sh
      # into it continuously, and a bind mount would churn a repo file 5x/sec.
      # tools/ is mounted (not baked in) so the banner script stays editable
      # without an image rebuild.
      - ./tools:/tools:ro
    networks:
      zpr-dns-demo:
        ipv4_address: 172.30.1.12

  client:
    image: zpr-dns-demo
    container_name: client
    command: ["/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-client.sh:/entrypoint.sh:ro
      - ./local-compute/conf/client:/conf
      - ./local-compute/logs:/logs
    networks:
      zpr-dns-demo:
        ipv4_address: 172.30.1.13

  dns:
    image: zpr-dns-demo
    container_name: dns
    command: ["/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-dns.sh:/entrypoint.sh:ro
      - ./local-compute/conf/dns:/conf
      - ./local-compute/logs:/logs
    networks:
      zpr-dns-demo:
        ipv4_address: 172.30.1.14

networks:
  zpr-dns-demo:
    name: zpr-dns-demo
    ipam:
      config:
        - subnet: 172.30.1.0/24
